[package]
name = "magic_orm"
version = "0.1.6"
edition = "2024"
description = "A Rust ORM for SQL databases with a focus on ease of use and performance."
license = "MIT"

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "macros", "uuid"] }
async-trait = "0.1"
futures-core = "0.3"
magic_derive = { path = "../magic_derive" }
anyhow = "1.0.102"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
uuid = { version = "1.23.4", features = ["serde", "v4"] }

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dev-dependencies]
insta = "1.48.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
